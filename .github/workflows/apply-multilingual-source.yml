name: Apply validated multilingual source migration

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/apply-multilingual-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Reuse validated migration and push source only
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          test_path = Path("src/echoflow/transcription/tests/test_executor.py")
          text = test_path.read_text(encoding="utf-8")
          marker = "def test_execution_segments_audio_once_loaded_and_writes_private_safe_json("
          start = text.index(marker)
          next_test = text.find("\ndef test_", start + len(marker))
          end = len(text) if next_test == -1 else next_test + 1
          block = text[start:end]
          old = 'assert document["detected_language"] == "en"'
          if old not in block:
              raise RuntimeError("stale detected-language expectation was not found")
          block = block.replace(old, 'assert document["detected_language"] is None', 1)
          test_path.write_text(text[:start] + block + text[end:], encoding="utf-8")

          workflow = Path(".github/workflows/repair-multilingual-migration-v5.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker_line = "        run: |"
          try:
              script_start = lines.index(marker_line) + 1
          except ValueError as exc:
              raise RuntimeError("v5 migration run block was not found") from exc

          script_lines: list[str] = []
          for line in lines[script_start:]:
              if line.startswith("          git rm "):
                  break
              if line.startswith("          "):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append("")
              else:
                  raise RuntimeError(f"unexpected v5 workflow indentation: {line!r}")
          if not script_lines or not any("uv run pytest" in line for line in script_lines):
              raise RuntimeError("v5 migration script extraction was incomplete")
          Path("/tmp/apply-multilingual-v5.sh").write_text(
              "\n".join(script_lines) + "\n", encoding="utf-8"
          )
          PY

          bash /tmp/apply-multilingual-v5.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Complete multilingual language attribution"
          git push origin HEAD:agent/multilingual-language-attribution
