name: Diagnose language attribution

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-language-attribution.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Inspect synthetic English and English-French attribution
        run: |
          uv run python <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from lingua import LanguageDetectorBuilder
          import scripts.verify_engine_acceptance as acceptance

          def summarize(document):
              spans = []
              for segment in document.get("segments", []):
                  text = str(segment.get("text", ""))
                  for span in segment.get("language_spans", []):
                      start = int(span["start_char"])
                      end = int(span["end_char"])
                      spans.append({
                          "language": span.get("language"),
                          "text": text[start:end],
                      })
              detector = LanguageDetectorBuilder.from_all_languages().build()
              whole = str(document.get("text", ""))
              confidence = detector.compute_language_confidence_values(whole)[:8]
              raw_sections = [
                  {
                      "language": result.language.iso_code_639_1.name.lower(),
                      "text": whole[result.start_index:result.end_index],
                  }
                  for result in detector.detect_multiple_languages_of(whole)
              ]
              return {
                  "text": whole,
                  "detected_language": document.get("detected_language"),
                  "detected_languages": document.get("detected_languages"),
                  "projected_spans": spans,
                  "whole_text_confidence": [
                      {
                          "language": item.language.iso_code_639_1.name.lower(),
                          "value": round(float(item.value), 6),
                      }
                      for item in confidence
                  ],
                  "raw_sections": raw_sections,
              }

          with tempfile.TemporaryDirectory(prefix="echoflow-language-diagnostic-") as tmp:
              root = Path(tmp).resolve()
              direct, media, mixed = acceptance._generate_media(root)

              cases = (
                  ("direct_en", direct, True),
                  ("normalized_en", media, False),
                  ("mixed_en_fr", mixed, False),
              )
              for name, source, allow_download in cases:
                  output = root / f"output-{name}"
                  env = acceptance._environment(root, output)
                  acceptance._initialize(env)
                  acceptance._transcribe(
                      source,
                      env=env,
                      allow_model_download=allow_download,
                  )
                  document, _ = acceptance._load_canonical(output)
                  print(name + "=" + json.dumps(summarize(document), ensure_ascii=False))
          PY
