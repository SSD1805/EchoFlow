name: Diagnose language attribution

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-language-attribution.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Inspect language evidence and engine timestamps
        run: |
          uv run python <<'PY'
          import json
          import tempfile
          import wave
          from pathlib import Path

          from faster_whisper import WhisperModel
          from lingua import LanguageDetectorBuilder
          import scripts.verify_engine_acceptance as acceptance

          detector = LanguageDetectorBuilder.from_all_languages().build()

          def code(language):
              return language.iso_code_639_1.name.lower()

          def confidence(text):
              return [
                  (code(item.language), round(float(item.value), 6))
                  for item in detector.compute_language_confidence_values(text)[:5]
              ]

          def inspect_text(label, text):
              sections = []
              for result in detector.detect_multiple_languages_of(text):
                  section = text[result.start_index:result.end_index]
                  sections.append({
                      "language": code(result.language),
                      "text": section,
                      "confidence": confidence(section),
                  })
              print(label + "=" + json.dumps({
                  "text": text,
                  "whole_confidence": confidence(text),
                  "sections": sections,
              }, ensure_ascii=False))

          inspect_text(
              "normalized_observed_text",
              "The quick brown fox jump over a crazy dog. Echo flow keep slow call recordings private and recoverable.",
          )

          with tempfile.TemporaryDirectory(prefix="echoflow-language-diagnostic-") as tmp:
              root = Path(tmp).resolve()
              direct, _media, mixed = acceptance._generate_media(root)
              model = WhisperModel(
                  "tiny",
                  device="cpu",
                  compute_type="int8",
                  cpu_threads=2,
                  num_workers=1,
                  download_root=str(root / "models"),
              )
              segments, info = model.transcribe(
                  str(mixed),
                  beam_size=1,
                  language=None,
                  word_timestamps=False,
                  multilingual=True,
                  chunk_length=10,
                  vad_filter=False,
                  log_progress=False,
              )
              raw = list(segments)
              with wave.open(str(mixed), "rb") as handle:
                  duration = handle.getnframes() / handle.getframerate()
              payload = {
                  "audio_duration": round(duration, 6),
                  "initial_language": info.language,
                  "initial_language_probability": round(float(info.language_probability), 6),
                  "segments": [
                      {
                          "start": round(float(segment.start), 6),
                          "end": round(float(segment.end), 6),
                          "text": segment.text.strip(),
                      }
                      for segment in raw
                  ],
              }
              print("mixed_engine=" + json.dumps(payload, ensure_ascii=False))
              inspect_text("mixed_engine_text", " ".join(segment.text.strip() for segment in raw))
          PY
