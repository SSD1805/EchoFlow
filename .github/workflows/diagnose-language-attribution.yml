name: Diagnose language attribution

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-language-attribution.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Inspect sentence-level candidate evidence
        run: |
          uv run python <<'PY'
          import json
          from lingua import LanguageDetectorBuilder

          detector = LanguageDetectorBuilder.from_all_languages().build()

          def code(language):
              return language.iso_code_639_1.name.lower()

          def inspect(text):
              values = detector.compute_language_confidence_values(text)[:8]
              detected = detector.detect_language_of(text)
              sections = detector.detect_multiple_languages_of(text)
              return {
                  "text": text,
                  "detected": None if detected is None else code(detected),
                  "confidence": [
                      [code(item.language), round(float(item.value), 6)]
                      for item in values
                  ],
                  "sections": [
                      [
                          code(item.language),
                          text[item.start_index:item.end_index],
                      ]
                      for item in sections
                  ],
              }

          samples = [
              "The quick brown fox jump over a crazy dog.",
              "Echo flow keep slow call recordings private and recoverable.",
              "The quick brown fox jump over a crazy dog. Echo flow keep slow call recordings private and recoverable.",
              "Bonjour!",
              "La Munich for Emma!",
              "I'm Emma Tire.",
              "Merci for you.",
              "Bonjour! La Munich for Emma!",
              "Bonjour. La musique française accompagne notre journée.",
              "Nous parlons français maintenant. Merci beaucoup.",
              "hello bonjour",
              "I need to go home, mais je suis fatigué aujourd'hui.",
          ]
          for sample in samples:
              print(json.dumps(inspect(sample), ensure_ascii=False))
          PY
