name: Diagnose language attribution

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-language-attribution.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Validate focused language attribution
        run: |
          uv run ruff check src/echoflow/transcription/language.py src/echoflow/transcription/tests/test_language.py
          uv run ruff format --check src/echoflow/transcription/language.py src/echoflow/transcription/tests/test_language.py
          uv run pytest \
            src/echoflow/transcription/tests/test_language.py \
            src/echoflow/transcription/tests/test_multilingual_semantics.py \
            src/echoflow/transcription/tests/test_executor.py
          uv run python <<'PY'
          from echoflow.transcription.language import LinguaLanguageAttributor

          attributor = LinguaLanguageAttributor()
          normalized = (
              "The quick brown fox jump over a crazy dog. "
              "Echo flow keep slow call recordings private and recoverable."
          )
          mixed = (
              "The quick brownfarks jump over the rainy dog. "
              "Echo flow keep slow call recording, private and recoverable. "
              "Bonjour! La Munich for Emma! I'm Emma Tire. Merci for you."
          )

          normalized_languages = {span.language for span in attributor.attribute(normalized)}
          mixed_languages = {span.language for span in attributor.attribute(mixed)}
          print("normalized", normalized_languages)
          print("mixed", mixed_languages)
          if normalized_languages != {"en"}:
              raise RuntimeError(
                  f"normalized English retained false language labels: {sorted(normalized_languages)}"
              )
          if not {"en", "fr"}.issubset(mixed_languages):
              raise RuntimeError(
                  f"mixed text lost English/French evidence: {sorted(mixed_languages)}"
              )
          if {"pl", "la"} & mixed_languages:
              raise RuntimeError(
                  f"mixed text retained known false labels: {sorted(mixed_languages)}"
              )
          PY
