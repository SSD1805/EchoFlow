name: Diagnose small multilingual

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-small-multilingual.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Qualify supported small CPU strategy on EN-FR fixture
        run: |
          uv run python <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          import scripts.verify_engine_acceptance as acceptance

          with tempfile.TemporaryDirectory(prefix="echoflow-small-multilingual-") as temporary:
              root = Path(temporary).resolve()
              _direct, _container, mixed = acceptance._generate_media(root)
              output = root / "output-small"
              env = acceptance._environment(root, output)
              acceptance._initialize(env)

              command = [
                  sys.executable,
                  "-m",
                  "echoflow",
                  "transcribe",
                  str(mixed),
                  "--profile",
                  "screening",
                  "--strategy",
                  "small-cpu-int8",
                  "--allow-model-download",
                  "--json",
              ]
              acceptance._run(command, env=env, capture_output=True)
              document, _ = acceptance._load_canonical(output)
              text = str(document.get("text", ""))
              words = acceptance._words(text)
              english = sorted(words & acceptance._ENGLISH_WORDS)
              french = sorted(words & acceptance._FRENCH_WORDS)
              languages = sorted({
                  str(span.get("language"))
                  for segment in document.get("segments", [])
                  if isinstance(segment, dict)
                  for span in segment.get("language_spans", [])
                  if isinstance(span, dict) and span.get("language")
              })
              print(json.dumps({
                  "text": text,
                  "english_anchors": english,
                  "french_anchors": french,
                  "languages": languages,
                  "engine_model": document.get("engine", {}).get("model"),
              }, ensure_ascii=False))

              if len(english) < acceptance._MIN_MIXED_WORDS:
                  raise RuntimeError(f"small lost English anchors: {english}")
              if len(french) < acceptance._MIN_MIXED_WORDS:
                  raise RuntimeError(f"small lost French anchors: {french}")
              if not {"en", "fr"}.issubset(set(languages)):
                  raise RuntimeError(
                      f"small transcript did not retain EN/FR attribution: {languages}"
                  )
              if document.get("engine", {}).get("model") != "small":
                  raise RuntimeError("EchoFlow did not execute the requested small model")
          PY
