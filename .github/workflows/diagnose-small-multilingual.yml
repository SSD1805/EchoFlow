name: Diagnose multilingual prompt reset

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-small-multilingual.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Test prompt reset workaround on exact EN-FR fixture
        run: |
          uv run python <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from faster_whisper import WhisperModel
          import scripts.verify_engine_acceptance as acceptance

          with tempfile.TemporaryDirectory(prefix="echoflow-prompt-reset-") as temporary:
              root = Path(temporary).resolve()
              _direct, _container, mixed = acceptance._generate_media(root)
              results = {}
              for model_name in ("tiny", "small"):
                  model = WhisperModel(
                      model_name,
                      device="cpu",
                      compute_type="int8",
                      cpu_threads=2,
                      num_workers=1,
                      download_root=str(root / "models"),
                  )
                  segments, info = model.transcribe(
                      str(mixed),
                      beam_size=1,
                      language=None,
                      word_timestamps=False,
                      multilingual=True,
                      chunk_length=10,
                      condition_on_previous_text=False,
                      vad_filter=False,
                      log_progress=False,
                  )
                  materialized = list(segments)
                  text = " ".join(segment.text.strip() for segment in materialized)
                  words = acceptance._words(text)
                  results[model_name] = {
                      "text": text,
                      "english_anchors": sorted(words & acceptance._ENGLISH_WORDS),
                      "french_anchors": sorted(words & acceptance._FRENCH_WORDS),
                      "initial_language": info.language,
                      "segments": [
                          [round(float(segment.start), 2), round(float(segment.end), 2), segment.text.strip()]
                          for segment in materialized
                      ],
                  }
                  del model
              print(json.dumps(results, ensure_ascii=False))

              passing = [
                  name
                  for name, result in results.items()
                  if len(result["english_anchors"]) >= acceptance._MIN_MIXED_WORDS
                  and len(result["french_anchors"]) >= acceptance._MIN_MIXED_WORDS
              ]
              if not passing:
                  raise RuntimeError("prompt reset did not recover enough bilingual content")
              print("passing_models=" + ",".join(passing))
          PY
