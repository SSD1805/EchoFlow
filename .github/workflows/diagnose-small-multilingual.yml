name: Diagnose multilingual windows

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/diagnose-small-multilingual.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install locked transcription stack
        run: uv sync --locked --extra transcription

      - name: Sweep small-model multilingual windows on exact EN-FR fixture
        run: |
          uv run python <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from faster_whisper import WhisperModel
          import scripts.verify_engine_acceptance as acceptance

          class LanguageLogProxy:
              def __init__(self, real):
                  self._real = real
                  self.log = []

              def detect_language(self, encoder_output):
                  result = self._real.detect_language(encoder_output)
                  token, probability = result[0][0]
                  self.log.append((token[2:-2], round(float(probability), 4)))
                  return result

              def __getattr__(self, name):
                  return getattr(self._real, name)

          with tempfile.TemporaryDirectory(prefix="echoflow-window-sweep-") as temporary:
              root = Path(temporary).resolve()
              _direct, _container, mixed = acceptance._generate_media(root)
              model = WhisperModel(
                  "small",
                  device="cpu",
                  compute_type="int8",
                  cpu_threads=2,
                  num_workers=1,
                  download_root=str(root / "models"),
              )
              original_model = model.model
              results = {}
              for chunk_length in (6, 7, 8, 9, 10, 12, 15, 30):
                  proxy = LanguageLogProxy(original_model)
                  model.model = proxy
                  try:
                      segments, info = model.transcribe(
                          str(mixed),
                          beam_size=1,
                          language=None,
                          word_timestamps=False,
                          multilingual=True,
                          chunk_length=chunk_length,
                          condition_on_previous_text=False,
                          vad_filter=False,
                          log_progress=False,
                      )
                      materialized = list(segments)
                  finally:
                      model.model = original_model
                  text = " ".join(segment.text.strip() for segment in materialized)
                  words = acceptance._words(text)
                  results[str(chunk_length)] = {
                      "language_windows": proxy.log,
                      "text": text,
                      "english_anchors": sorted(words & acceptance._ENGLISH_WORDS),
                      "french_anchors": sorted(words & acceptance._FRENCH_WORDS),
                      "segments": [
                          [
                              round(float(segment.start), 2),
                              round(float(segment.end), 2),
                              segment.text.strip(),
                          ]
                          for segment in materialized
                      ],
                  }
              print(json.dumps(results, ensure_ascii=False, indent=2))
              passing = [
                  length
                  for length, result in results.items()
                  if len(result["english_anchors"]) >= acceptance._MIN_MIXED_WORDS
                  and len(result["french_anchors"]) >= acceptance._MIN_MIXED_WORDS
                  and any(language == "fr" for language, _ in result["language_windows"])
              ]
              print("passing_windows=" + ",".join(passing))
              if not passing:
                  raise RuntimeError("no tested window preserved enough bilingual content")
          PY
