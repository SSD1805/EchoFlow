name: Diarization Acceptance

on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:
    inputs:
      run_real_model:
        description: Run gated Community-1 inference using the HF_TOKEN repository secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: diarization-acceptance
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Build distribution
        run: uv build

      - name: Verify clean diarization install
        run: uv run python scripts/verify_diarization_install.py dist

  real-model:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYANNOTE_METRICS_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Require gated-model authentication
        shell: bash
        run: test -n "$HF_TOKEN"

      - name: Install diarization runtime
        run: uv sync --locked --extra diarization

      - name: Install local speech synthesizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng

      - name: Generate non-sensitive local speech
        shell: bash
        run: >-
          espeak-ng
          -w "${{ runner.temp }}/diarization-acceptance.wav"
          "EchoFlow is running a local speaker diarization acceptance test. The recording stays on this runner."

      - name: Run real Community-1 inference twice
        run: >-
          uv run python scripts/verify_diarization_acceptance.py
          "${{ runner.temp }}/diarization-acceptance.wav"
          --cache-dir "${{ runner.temp }}/pyannote-cache"
