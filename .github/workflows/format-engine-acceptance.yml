name: Format engine acceptance

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/format-engine-acceptance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Format exactly the acceptance script
        shell: bash
        run: |
          uv sync --locked --all-groups --extra transcription
          uv run ruff format scripts/verify_engine_acceptance.py
          uv run ruff format --check scripts/verify_engine_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_engine_acceptance.py
          git diff --cached --check
          git commit -m "Format engine acceptance script"
          git push origin HEAD:agent/multilingual-language-attribution
