name: Frontend lint refresh

on:
  push:
    branches: [agent/security-dependency-refresh]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-dependency-refresh
          persist-credentials: true

      - name: Add current frontend lint toolchain
        working-directory: frontend
        run: >-
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund
          eslint@latest
          @eslint/js@latest
          typescript-eslint@latest
          eslint-plugin-react-hooks@latest
          globals@latest

      - name: Commit manifest and lock
        shell: bash
        run: |
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(frontend): add locked ESLint toolchain"
          git push origin HEAD:agent/security-dependency-refresh
