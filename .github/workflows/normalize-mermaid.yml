name: Normalize Mermaid docs

on:
  push:
    branches: [agent/mermaid-evidence-reader]
    paths:
      - scripts/normalize_mermaid_docs.py
      - .github/workflows/normalize-mermaid.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/mermaid-evidence-reader

      - name: Normalize Mermaid Markdown
        run: python scripts/normalize_mermaid_docs.py

      - name: Refuse non-Markdown output
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(README\.md|ROADMAP\.md|docs/.*\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Normalizer changed unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit normalized documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Mermaid documentation already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md docs
          git commit -m "docs: normalize Mermaid for GitHub portability"
          git push origin HEAD:agent/mermaid-evidence-reader
