name: Patch roadmap diagram

on:
  push:
    branches:
      - agent/github-diagrams-evidence-reader
    paths:
      - .github/workflows/patch-roadmap-diagram.yml

permissions:
  contents: write

jobs:
  patch-roadmap:
    if: github.repository == 'SSD1805/EchoFlow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/github-diagrams-evidence-reader
          fetch-depth: 0

      - name: Replace first Mermaid block with visible SVG and retained source
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"```mermaid\n(?P<body>.*?)\n```", re.DOTALL)
          match = pattern.search(text)
          if match is None:
              raise SystemExit("ROADMAP.md has no Mermaid block to patch")

          source = match.group("body")
          replacement = (
              "![EchoFlow product roadmap](docs/diagrams/product-roadmap.svg)\n\n"
              "<details>\n"
              "<summary>Mermaid source</summary>\n\n"
              "```mermaid\n"
              f"{source}\n"
              "```\n\n"
              "</details>"
          )
          updated = text[: match.start()] + replacement + text[match.end() :]
          path.write_text(updated, encoding="utf-8")

      - name: Commit only ROADMAP.md
        run: |
          test -z "$(git status --porcelain -- . ':!ROADMAP.md')"
          git diff --check -- ROADMAP.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ROADMAP.md
          git commit -m "docs: make roadmap diagram visible on GitHub"
          git push origin HEAD:agent/github-diagrams-evidence-reader
