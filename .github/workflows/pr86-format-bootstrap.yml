name: PR86 formatting bootstrap

on:
  push:
    branches:
      - agent/research-search-controls

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/research-search-controls
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
      - run: uv sync --locked --group dev
      - name: Apply exact Ruff formatting
        run: |
          uv run ruff format \
            src/echoflow/desktop/bridge.py \
            src/echoflow/desktop/research_search_bridge.py \
            src/echoflow/library/research_search_controls.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            src/echoflow/desktop/bridge.py \
            src/echoflow/desktop/research_search_bridge.py \
            src/echoflow/library/research_search_controls.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/echoflow/desktop/bridge.py \
            src/echoflow/desktop/research_search_bridge.py \
            src/echoflow/library/research_search_controls.py
          git commit -m 'style: apply Ruff formatting to typed search tranche'
          git push origin HEAD:agent/research-search-controls
