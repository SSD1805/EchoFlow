name: PR86 roadmap bootstrap

on:
  push:
    branches:
      - agent/research-search-controls

permissions:
  contents: write

jobs:
  roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/research-search-controls
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Synchronize first-release roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('ROADMAP.md')
          text = path.read_text()

          replacements = {
              '''lifecycle, and explicit research-anchor maintenance. Remaining work is primarily
          productization: finish advanced Research/search controls, expose processing/model/job
          controls, add playback and lifecycle UI, package the application, make durable work
          portable, and qualify real devices.''': '''lifecycle, explicit research-anchor maintenance, and backend-authoritative typed Research
          search controls. Remaining work is primarily productization: expose processing/model/job
          controls, add playback and lifecycle UI, package the application, make durable work
          portable, and qualify real devices.''',
              '''research return, first-class label navigation, saved-search lifecycle/replay, and explicit
          research-anchor review/re-anchor.''': '''research return, first-class label navigation, saved-search lifecycle/replay, explicit
          research-anchor review/re-anchor, and advanced typed Research search with whole-intent
          saved-search editing.''',
              '''| Lexical BM25 retrieval | private corpus ranking | **implemented** through Library discovery | advanced phrase/ANY/ALL and sort controls | Research/search completion |''': '''| Lexical BM25 retrieval | private corpus ranking | **implemented** through Library discovery and typed Research controls | optional search-surface polish | Research/search complete |''',
              '''| Unified discovery | typed transcript/note/tag/collection groups without fabricated cross-type score | **implemented** | richer typed filters and object-specific actions | Research/search completion |''': '''| Unified discovery | typed transcript/note/tag/collection groups without fabricated cross-type score | **implemented** alongside advanced typed evidence search | optional object-specific action polish | Research/search complete |''',
              '''| Research notes | exact generation-bound anchors + superseded anchor history in authoritative SQLite | browse/create/edit/delete/exact-evidence return/review/re-anchor **implemented** | richer typed search integration | Research/search completion |''': '''| Research notes | exact generation-bound anchors + superseded anchor history in authoritative SQLite | browse/create/edit/delete/exact-evidence return/review/re-anchor + typed search integration **implemented** | optional research-surface polish | Research/search complete |''',
              '''| Saved searches | typed durable intent with current-corpus re-resolution and version-safe rename/delete | create/run/rename/delete + result handoff **implemented** | advanced typed intent editing alongside search controls | Research/search completion |''': '''| Saved searches | typed durable intent with current-corpus re-resolution and version-safe mutation | create/run/delete + inspectable whole-intent editing **implemented** | optional saved-question polish | Research/search complete |''',
              '''| Research-aware filtering | tags/collections/note text constrain evidence before ranking | backend ready; label-note filtering visible | expose full transcript search filters with inspectable active state | Research/search completion |''': '''| Research-aware filtering | tags/collections/note text constrain evidence before ranking | full typed transcript/research filters with inspectable applied intent **implemented** | optional authoritative facet/catalog convenience pickers | Research/search complete |''',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one roadmap match, found {count}: {old[:70]!r}')
              text = text.replace(old, new)

          pattern = re.compile(
              r'## 1\. Finish advanced Research/search controls\n.*?(?=\n## 2\. Build the desktop Processing center)',
              re.S,
          )
          replacement = '''## 1. Advanced Research/search controls complete

          Current first-release Research foundation after this tranche:

          - Research navigation and authoritative overview;
          - current-versus-older canonical generation presentation;
          - note creation from a verified evidence window;
          - atomic edit of note body + tag/collection assignments;
          - guarded note deletion;
          - optimistic concurrency using authoritative `updated_at`;
          - exact-generation note → verified-evidence return with no automatic rebinding;
          - first-class tag/collection navigation with backend AND semantics;
          - saved-search create/run/delete plus version-safe whole-intent inspection/editing;
          - explicit stale/unavailable anchor review;
          - deliberate same-source re-anchor with reviewed-generation confirmation and durable prior-anchor history;
          - typed phrase/ANY/ALL, speaker, language, transcript, research-filter, retrieval-mode,
            sort, result-limit, and context controls;
          - backend-returned applied intent and retrieval provenance; and
          - no frontend SQL, SQLite, raw evidence paths, derived evidence-scope construction,
            repair-candidate derivation, ranking policy, or generation-selection logic.

          The primary research circuit is now coherent: **find evidence → verify → annotate →
          organize → ask a durable typed question → replay/edit it → return to exact evidence →
          deliberately maintain the evidence pointer when needed.** Further Research additions
          are polish or second-horizon work rather than blockers for the next first-release
          tranche.
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Research critical-path section, found {count}')

          path.write_text(text)
          PY
      - name: Commit roadmap synchronization
        run: |
          if git diff --quiet -- ROADMAP.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ROADMAP.md
          git commit -m 'docs: mark Research search completion in roadmap'
          git push origin HEAD:agent/research-search-controls
