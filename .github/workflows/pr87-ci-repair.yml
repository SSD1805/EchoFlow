name: PR87 CI repair

on:
  push:
    branches:
      - agent/processing-center

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/processing-center
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
      - name: Decompose desktop control-plane dispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('src/echoflow/desktop/bridge.py')
          text = bridge.read_text()
          old = '''    if request.method.startswith("processing."):\n        return dispatch_processing(request.method, request.params, services.processing)\n\n    if request.method.startswith("workspace.research.search."):\n        return dispatch_research_search(\n            request.method, request.params, services.workspace\n        )\n\n    if request.method.startswith("workspace.research.note."):\n        return _dispatch_research_note(request, services.workspace)\n\n    if request.method.startswith("workspace.research.saved_search."):\n        return _dispatch_saved_search(request, services.workspace)\n'''
          new = '''    if request.method.startswith(("processing.", "workspace.research.")):\n        return _dispatch_control_plane(request, services)\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one desktop control-plane dispatch block')
          text = text.replace(old, new)

          marker = '\n\ndef _dispatch(request: _DesktopRequest, services: DesktopServices) -> object:\n'
          helper = '''\n\ndef _dispatch_control_plane(\n    request: _DesktopRequest, services: DesktopServices\n) -> object:\n    if request.method.startswith("processing."):\n        return dispatch_processing(request.method, request.params, services.processing)\n    if request.method.startswith("workspace.research.search."):\n        return dispatch_research_search(\n            request.method, request.params, services.workspace\n        )\n    if request.method.startswith("workspace.research.note."):\n        return _dispatch_research_note(request, services.workspace)\n    if request.method.startswith("workspace.research.saved_search."):\n        return _dispatch_saved_search(request, services.workspace)\n    raise ValueError("Unsupported desktop control-plane method")\n'''
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one desktop dispatch marker')
          bridge.write_text(text.replace(marker, helper + marker))
          PY
      - name: Apply repository Python style gates
        run: |
          uv sync --locked --group dev
          uv run ruff check src/echoflow/app/processing_center.py src/echoflow/desktop/bridge.py --fix
          uv run ruff format src/echoflow/app/processing_center.py src/echoflow/desktop/bridge.py
          uv run ruff check src/echoflow/app/processing_center.py src/echoflow/desktop/bridge.py
      - name: Remove branch-only repair workflows and commit
        run: |
          rm -f .github/workflows/pr87-ci-repair.yml
          rm -f .github/workflows/pr87-test-services-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/echoflow/app/processing_center.py src/echoflow/desktop/bridge.py .github/workflows/pr87-ci-repair.yml .github/workflows/pr87-test-services-bootstrap.yml
          git commit -m 'fix(ci): satisfy Processing Center static contracts'
          git push origin HEAD:agent/processing-center
