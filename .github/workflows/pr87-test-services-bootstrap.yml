name: PR87 test service bootstrap

on:
  push:
    branches:
      - agent/processing-center

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/processing-center
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
      - run: uv sync --locked --group dev
      - name: Keep legacy bridge fixtures explicit and outer dispatch simple
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'src/echoflow/desktop/tests/test_bridge.py',
              'src/echoflow/desktop/tests/test_research_bridge.py',
              'src/echoflow/desktop/tests/test_research_anchor_bridge.py',
              'src/echoflow/desktop/tests/test_research_search_bridge.py',
              'src/echoflow/desktop/tests/test_research_bridge_filters.py',
              'src/echoflow/desktop/tests/test_research_bridge_mutations.py',
              'src/echoflow/desktop/tests/test_research_bridge_navigation_saved_search.py',
          ]
          pattern = re.compile(r'(\n\s+workspace=cast\(Any, [^\n]+\),\n)(\s+\))')
          for filename in files:
              path = Path(filename)
              text = path.read_text()
              if 'processing=cast(Any, object())' in text:
                  continue
              text, count = pattern.subn(
                  r'\1        processing=cast(Any, object()),\n\2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Expected one DesktopServices workspace fixture in {filename}, found {count}')
              path.write_text(text)

          bridge_path = Path('src/echoflow/desktop/bridge.py')
          bridge = bridge_path.read_text()
          old = '''    if request.method.startswith("processing."):
        return dispatch_processing(request.method, request.params, services.processing)

    if request.method.startswith("workspace.research.search."):
        return dispatch_research_search(
            request.method, request.params, services.workspace
        )

    if request.method.startswith("workspace.research.note."):
        return _dispatch_research_note(request, services.workspace)

    if request.method.startswith("workspace.research.saved_search."):
        return _dispatch_saved_search(request, services.workspace)
'''
          new = '''    if request.method.startswith(
        (
            "processing.",
            "workspace.research.search.",
            "workspace.research.note.",
            "workspace.research.saved_search.",
        )
    ):
        return _dispatch_control_plane(request, services)
'''
          if old in bridge:
              bridge = bridge.replace(old, new, 1)
              marker = '\n\ndef _dispatch(request: _DesktopRequest, services: DesktopServices) -> object:\n'
              helper = '''\n\ndef _dispatch_control_plane(
    request: _DesktopRequest,
    services: DesktopServices,
) -> object:
    if request.method.startswith("processing."):
        return dispatch_processing(request.method, request.params, services.processing)
    if request.method.startswith("workspace.research.search."):
        return dispatch_research_search(
            request.method, request.params, services.workspace
        )
    if request.method.startswith("workspace.research.note."):
        return _dispatch_research_note(request, services.workspace)
    return _dispatch_saved_search(request, services.workspace)
'''
              if marker not in bridge:
                  raise SystemExit('Could not locate outer desktop dispatch marker')
              bridge = bridge.replace(marker, helper + marker, 1)
              bridge_path.write_text(bridge)
          elif '_dispatch_control_plane' not in bridge:
              raise SystemExit('Desktop bridge dispatch shape was not recognized')
          PY
      - name: Apply exact Ruff fixes and formatting
        run: |
          uv run ruff check --fix \
            src/echoflow/app/processing_center.py \
            src/echoflow/desktop/processing_bridge.py \
            src/echoflow/desktop/processing_worker.py \
            src/echoflow/desktop/bridge.py \
            src/echoflow/desktop/tests
          uv run ruff format \
            src/echoflow/app/processing_center.py \
            src/echoflow/desktop/processing_bridge.py \
            src/echoflow/desktop/processing_worker.py \
            src/echoflow/desktop/bridge.py \
            src/echoflow/desktop/tests
      - name: Commit fixture and static cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/echoflow/app/processing_center.py src/echoflow/desktop
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(processing): keep desktop control plane within quality gates'
          git push origin HEAD:agent/processing-center
