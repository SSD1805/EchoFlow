name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Check lockfile
        run: uv lock --check

      - name: Export locked runtime and transcription dependencies
        run: >-
          uv export
          --locked
          --no-dev
          --extra transcription
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file ${{ runner.temp }}/echoflow-runtime-requirements.txt

      - name: Audit runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement ${{ runner.temp }}/echoflow-runtime-requirements.txt
          --progress-spinner off

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Find certain dead code
        run: uv run vulture

      - name: Report complexity
        run: |
          uv run radon cc src/echoflow --total-average
          uv run radon mi src/echoflow

      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=echoflow
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Run tests
        run: uv run pytest

      - name: Inspect runner policy
        run: uv run echoflow runner --json

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist
