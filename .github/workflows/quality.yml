name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Install native media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify native media tools
        run: >-
          uv run python -c "import shutil;
          missing=[name for name in ('ffmpeg','ffprobe') if shutil.which(name) is None];
          assert not missing, f'Missing native media tools: {missing}'"

      - name: Check lockfile
        run: uv lock --check

      - name: Export locked runtime and optional capability dependencies
        run: >-
          uv export
          --locked
          --no-dev
          --extra transcription
          --extra diarization
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file ${{ runner.temp }}/echoflow-runtime-requirements.txt

      # Lightning 2.6.5 is currently pulled by pyannote and is affected by
      # CVE-2026-58659 / PYSEC-2026-3624. EchoFlow's diarization adapter blocks
      # affected/unproven Lightning releases before importing pyannote or resolving
      # a model. Keep this one advisory visible here until upstream ships its merged fix.
      - name: Verify compensated Lightning advisory scope
        shell: bash
        run: >-
          grep -Eq '^lightning==2\.6\.5([ ;]|$)'
          "${{ runner.temp }}/echoflow-runtime-requirements.txt"

      - name: Audit locked runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement ${{ runner.temp }}/echoflow-runtime-requirements.txt
          --no-deps
          --disable-pip
          --ignore-vuln PYSEC-2026-3624
          --progress-spinner off

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Check formatting
        shell: bash
        run: |
          if uv run ruff format --check .; then
            exit 0
          fi
          uv run ruff format .
          while IFS= read -r path; do
            patch=$(git diff -- "${path}" | base64 -w 0)
            echo "::error file=${path}::RUFF_FORMAT_PATCH_BASE64=${patch}"
          done < <(git diff --name-only)
          exit 1

      - name: Type check
        run: uv run mypy

      - name: Find certain dead code
        run: uv run vulture

      - name: Report complexity
        run: |
          uv run radon cc src/echoflow --total-average
          uv run radon mi src/echoflow

      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=echoflow
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Install native media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install native media tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Verify native media tools
        run: >-
          uv run python -c "import shutil;
          missing=[name for name in ('ffmpeg','ffprobe') if shutil.which(name) is None];
          assert not missing, f'Missing native media tools: {missing}'"

      - name: Run tests
        run: uv run pytest

      - name: Inspect runner policy
        run: uv run echoflow runner --json

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist
