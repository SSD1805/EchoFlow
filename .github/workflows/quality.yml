name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install static analysis dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Check formatting
        run: uv run ruff format --diff .

      - name: Type check
        run: uv run mypy

      - name: Find certain dead code
        run: uv run vulture

      - name: Report complexity
        run: |
          uv run radon cc src/echoflow --total-average
          uv run radon mi src/echoflow

      - name: Export locked runtime and optional capability dependencies
        run: >-
          uv export
          --locked
          --no-dev
          --extra transcription
          --extra diarization
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file ${{ runner.temp }}/echoflow-runtime-requirements.txt

      - name: Verify compensated Lightning advisory scope
        shell: bash
        run: >-
          grep -Eq '^lightning==2\.6\.5([ ;]|$)'
          "${{ runner.temp }}/echoflow-runtime-requirements.txt"

      - name: Audit locked runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement ${{ runner.temp }}/echoflow-runtime-requirements.txt
          --no-deps
          --disable-pip
          --ignore-vuln PYSEC-2026-3624
          --progress-spinner off

  frontend-static:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/desktop-import-ui' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Regenerate npm lockfile from pinned manifest
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          git diff --check -- package-lock.json
          git diff --quiet -- package-lock.json && {
            echo "npm produced no lockfile change";
            exit 2;
          }

      - name: Commit regenerated lockfile only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --quiet && {
            echo "No lockfile change was staged";
            exit 2;
          }
          git commit -m "build(frontend): regenerate npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit 1

  frontend-playwright:
    needs: [static, frontend-static]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install locked frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright accessibility and ingestion flows
        run: npm run test:e2e

  quality:
    needs: [static, frontend-static]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Install native media tools
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          timeout 240s brew install ffmpeg
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Verify native media tools
        run: >-
          uv run python -c "import shutil;
          missing=[name for name in ('ffmpeg','ffprobe') if shutil.which(name) is None];
          assert not missing, f'Missing native media tools: {missing}'"

      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=echoflow
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist

  platform-smoke:
    needs: [static, frontend-static]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --extra transcription

      - name: Import optional CPU engine
        run: uv run python -c "import faster_whisper; print(faster_whisper.__version__)"

      - name: Install native media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install native media tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Verify native media tools
        run: >-
          uv run python -c "import shutil;
          missing=[name for name in ('ffmpeg','ffprobe') if shutil.which(name) is None];
          assert not missing, f'Missing native media tools: {missing}'"

      - name: Run tests
        run: uv run pytest

      - name: Inspect runner policy
        run: uv run echoflow runner --json

      - name: Build distributions
        run: uv build

      - name: Verify clean wheel install
        run: uv run python scripts/verify_distribution.py dist
