name: Finish multilingual migration repair

on:
  push:
    branches: [agent/multilingual-language-attribution]
    paths:
      - .github/workflows/repair-multilingual-migration-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/multilingual-language-attribution

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Apply bounded migration fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"expected exactly one replacement in {path}: {old[:100]!r}; "
                      f"found {text.count(old)}"
                  )
              write(path, text.replace(old, new, 1))

          # Name the new execution semantics after what faster-whisper actually does.
          for root in (Path("src/echoflow"), Path("scripts")):
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("AutoLanguageMode.PER_SEGMENT", "AutoLanguageMode.NATIVE_MULTILINGUAL")
                  text = text.replace("PER_SEGMENT = \"per_segment_v1\"", "NATIVE_MULTILINGUAL = \"native_multilingual_v1\"")
                  text = text.replace("per_segment_v1", "native_multilingual_v1")
                  path.write_text(text, encoding="utf-8")

          # Schema-2 checkpoint contracts are valid. Schema-1 remains valid and preserves
          # the old job-latched language semantics on resume.
          replace_once(
              "src/echoflow/transcription/checkpoint.py",
              '        if self.job_plan_schema_version != 1:\n            raise ValueError("checkpoint job-plan schema version is unsupported")\n',
              '        if self.job_plan_schema_version not in (1, 2):\n            raise ValueError("checkpoint job-plan schema version is unsupported")\n',
          )

          # Published language lists come from explicit Lingua spans first. The public
          # faster-whisper Segment API does not expose native multilingual window language.
          replace_once(
              "src/echoflow/transcription/executor.py",
              '''        detected_languages: list[str] = []
          for segment in segments:
              if (
                  segment.detected_language is not None
                  and segment.detected_language not in detected_languages
              ):
                  detected_languages.append(segment.detected_language)
          ''',
              '''        detected_languages: list[str] = []
          for segment in segments:
              for span in segment.language_spans:
                  if span.language not in detected_languages:
                      detected_languages.append(span.language)
          if not detected_languages:
              for segment in segments:
                  if (
                      segment.detected_language is not None
                      and segment.detected_language not in detected_languages
                  ):
                      detected_languages.append(segment.detected_language)
          ''',
          )

          # Canonical validation derives the same language list from the same evidence.
          replace_once(
              "src/echoflow/transcription/models.py",
              '''        derived_languages: list[str] = []
          for segment in self.segments:
              if (
                  segment.detected_language is not None
                  and segment.detected_language not in derived_languages
              ):
                  derived_languages.append(segment.detected_language)
          ''',
              '''        derived_languages: list[str] = []
          for segment in self.segments:
              for span in segment.language_spans:
                  if span.language not in derived_languages:
                      derived_languages.append(span.language)
          if not derived_languages:
              for segment in self.segments:
                  if (
                      segment.detected_language is not None
                      and segment.detected_language not in derived_languages
                  ):
                      derived_languages.append(segment.detected_language)
          ''',
          )

          # The new canonical document is schema 2; schema 3 remains unsupported.
          replace_once(
              "src/echoflow/transcription/tests/test_models.py",
              '        TranscriptionJobPlan(*arguments, warnings=(), schema_version=2)\n',
              '        TranscriptionJobPlan(*arguments, warnings=(), schema_version=3)\n',
          )
          replace_once(
              "src/echoflow/transcription/tests/test_models.py",
              '        ({"schema_version": 2}, "unsupported transcript schema version"),\n',
              '        ({"schema_version": 3}, "unsupported transcript schema version"),\n',
          )
          replace_once(
              "src/echoflow/transcription/tests/test_planner.py",
              '    assert plan.schema_version == 1\n',
              '    assert plan.schema_version == 2\n',
          )
          replace_once(
              "src/echoflow/transcription/tests/test_executor.py",
              '    assert document["schema_version"] == 1\n',
              '    assert document["schema_version"] == 2\n',
          )

          # Existing exact serialization tests intentionally account for the new nullable
          # semantic landing points and provenance field.
          replace_once(
              "src/echoflow/transcription/tests/test_models.py",
              '''        "average_log_probability": -0.4,
              "no_speech_probability": 0.15,
          }
          ''',
              '''        "average_log_probability": -0.4,
              "no_speech_probability": 0.15,
              "detected_language": None,
              "language_probability": None,
              "language": None,
              "language_spans": [],
              "speaker_ref": None,
          }
          ''',
          )
          replace_once(
              "src/echoflow/transcription/tests/test_models.py",
              '''        "beam_size": 5,
              "requested_language": None,
          }
          ''',
              '''        "beam_size": 5,
              "requested_language": None,
              "auto_language_mode": "job_latched_v1",
          }
          ''',
          )

          # Assembly must not invent per-output-segment acoustic labels from invocation-level
          # TranscriptionInfo when native multilingual decoding is active.
          path = "src/echoflow/transcription/tests/test_multilingual_semantics.py"
          text = read(path)
          old = '''    assert tuple(segment.detected_language for segment in assembled.segments) == (
              "en",
              "fr",
          )
          '''
          if old in text:
              text = text.replace(
                  old,
                  '''    assert all(
              segment.detected_language is None for segment in assembled.segments
          )
          ''',
                  1,
              )
          write(path, text)

          # Assert the engine-native multilingual controls themselves, not just language=None.
          path = "src/echoflow/transcription/tests/test_backend_session.py"
          text = read(path)
          text = text.replace(
              '            calls.append(kwargs["language"])\n            return iter(()), next(infos)\n',
              '            calls.append((kwargs["language"], kwargs["multilingual"], kwargs["chunk_length"]))\n            return iter(()), next(infos)\n',
              1,
          )
          text = text.replace(
              '    assert calls == [None, None]\n',
              '    assert calls == [(None, True, 10), (None, True, 10)]\n',
              1,
          )
          write(path, text)
          PY

          uv run ruff check --fix \
            src/echoflow/transcription \
            scripts/verify_engine_acceptance.py
          uv run ruff format \
            src/echoflow/transcription \
            scripts/verify_engine_acceptance.py

          git rm \
            .github/workflows/repair-multilingual-migration.yml \
            .github/workflows/repair-multilingual-migration-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows
          git commit -m "Finish multilingual migration repair"
          git push origin HEAD:agent/multilingual-language-attribution
