name: Rustfmt refresh

on:
  push:
    branches: [agent/security-dependency-refresh]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-dependency-refresh
          persist-credentials: true

      - name: Format native Rust source
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml

      - name: Commit rustfmt output
        shell: bash
        run: |
          git add frontend/src-tauri/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(rust): normalize native host formatting"
          git push origin HEAD:agent/security-dependency-refresh
