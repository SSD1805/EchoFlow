name: Temporary Scholion dependency rollup

on:
  pull_request:
    paths:
      - ".github/workflows/scholion-identity-migration.yml"

permissions:
  contents: write

jobs:
  refresh-locks:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rename-scholion-doc-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out identity branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rename-scholion-doc-audit

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"

      - name: Refresh Python lock
        run: uv lock

      - name: Refresh frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh Rust dialog dependency graph
        run: >-
          cargo update
          --manifest-path frontend/src-tauri/Cargo.toml
          -p tauri-plugin-dialog
          --precise 2.7.2

      - name: Verify lock coherence
        shell: bash
        run: |
          uv lock --check
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          cargo metadata --locked --format-version 1 --manifest-path frontend/src-tauri/Cargo.toml --no-deps >/dev/null

      - name: Commit refreshed locks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock frontend/package-lock.json frontend/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lock graphs already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh combined dependency locks"
          git push origin HEAD:agent/rename-scholion-doc-audit

# One-shot trigger after reconciling the identity branch with current main.
