name: Static Analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows and embedded shell
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: "1.7.12"
          shellcheck: true
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.29.0"
          collect: "all"
          online-audits: false
          persona: "regular"
          advanced-security: false
          annotations: true

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install locked frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint TypeScript and React
        run: npm run lint

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux build prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential
          curl
          file
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          wget

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint locked Rust host
        run: >-
          cargo clippy
          --locked
          --manifest-path src-tauri/Cargo.toml
          --all-targets
          --all-features
          --
          -D warnings

  rust-dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce Rust license, source, and dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.90.0"
          manifest-path: "frontend/src-tauri/Cargo.toml"
          command: "check bans licenses sources"
