name: Transcript Library Bootstrap

on:
  push:
    branches: [agent/transcript-library-search]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message != 'Wire transcript library runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/transcript-library-search

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"

      - name: Wire CLI and DuckDB dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path("src/echoflow/cli.py")
          text = cli.read_text()
          old_import = "from echoflow.cli_jobs import register_job_commands\n"
          new_import = old_import + "from echoflow.cli_library import register_library_commands\n"
          if "from echoflow.cli_library import register_library_commands" not in text:
              if old_import not in text:
                  raise SystemExit("CLI job registration import anchor not found")
              text = text.replace(old_import, new_import, 1)
          old_registration = "register_job_commands(app, _container)\nregister_model_commands(app, _container)"
          new_registration = (
              "register_job_commands(app, _container)\n"
              "register_library_commands(app, _container)\n"
              "register_model_commands(app, _container)"
          )
          if "register_library_commands(app, _container)" not in text:
              if old_registration not in text:
                  raise SystemExit("CLI registration anchor not found")
              text = text.replace(old_registration, new_registration, 1)
          cli.write_text(text)

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          dependency_anchor = '    "dependency-injector>=4.48,<5",\n'
          if '"duckdb>=1.4,<2"' not in text:
              if dependency_anchor not in text:
                  raise SystemExit("dependency anchor not found")
              text = text.replace(
                  dependency_anchor,
                  dependency_anchor + '    "duckdb>=1.4,<2",\n',
                  1,
              )
          poodle_anchor = '    "src/echoflow/interfaces/private_storage.py",\n'
          library_paths = (
              '    "src/echoflow/library/index.py",\n'
              '    "src/echoflow/library/duckdb_index.py",\n'
              '    "src/echoflow/library/projection.py",\n'
              '    "src/echoflow/library/service.py",\n'
          )
          if '"src/echoflow/library/index.py"' not in text:
              if poodle_anchor not in text:
                  raise SystemExit("Poodle anchor not found")
              text = text.replace(
                  poodle_anchor,
                  poodle_anchor + "".join(library_paths),
                  1,
              )
          pyproject.write_text(text)
          PY
          uv lock

      - name: Normalize touched Python files
        run: |
          uv sync --locked --all-groups --extra transcription
          uv run ruff check --fix src/echoflow/cli.py src/echoflow/cli_library.py src/echoflow/library src/echoflow/app/app_container.py
          uv run ruff format src/echoflow/cli.py src/echoflow/cli_library.py src/echoflow/library src/echoflow/app/app_container.py

      - name: Commit generated runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echoflow/cli.py src/echoflow/cli_library.py src/echoflow/library src/echoflow/app/app_container.py pyproject.toml uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "Wire transcript library runtime"
          git push origin HEAD:agent/transcript-library-search
