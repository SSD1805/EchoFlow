  <text x="70" y="62" fill="#1F2930" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">The Scholion family portrait</text>
  <text x="70" y="91" fill="#5F6762" font-family="Inter,Segoe UI,sans-serif" font-size="15">Evidence stays authoritative. Research stays durable. Search and presentation stay replaceable.</text>

