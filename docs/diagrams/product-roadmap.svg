<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1700 650">
  <title id="title">EchoFlow product roadmap</title>
  <desc id="desc">EchoFlow progresses from local media through reliable transcription, canonical evidence, retrieval, verified navigation, durable research, lifecycle controls, desktop workflows, the completed research evidence loop, a processing center, playback, packaging, portability, and release qualification.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315E63"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1F2930" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1700" height="650" rx="30" fill="#FBF9F4"/>
  <text x="70" y="64" fill="#1F2930" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">EchoFlow roadmap</text>
  <text x="70" y="94" fill="#5F6762" font-family="Inter,Segoe UI,sans-serif" font-size="15">From trustworthy local transcription to a complete private evidence workspace.</text>

  <g stroke="#315E63" stroke-width="3" fill="none" marker-end="url(#arrow)">
