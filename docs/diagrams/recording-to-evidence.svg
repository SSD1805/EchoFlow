<!-- mermaid-sha256: 0a002f1f482269e8c2365879f7ad3f7beaead8547a7df2015c0777d27ed92ae2 -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 430">
  <title id="title">EchoFlow recording to evidence flow</title>
  <desc id="desc">A local recording is inspected, transcribed into canonical evidence, projected into searchable views, verified for navigation, connected to durable human research, and governed by explicit custody planning.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315E63"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1F2930" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="430" rx="28" fill="#FBF9F4"/>
  <text x="64" y="58" fill="#1F2930" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">Recording → verified evidence → durable research</text>
  <text x="64" y="86" fill="#5F6762" font-family="Inter,Segoe UI,sans-serif" font-size="15">Canonical evidence stays authoritative. Search and publication views stay rebuildable.</text>

  <g stroke="#315E63" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M220 175H300"/><path d="M500 175H580"/><path d="M780 175H860"/><path d="M1060 175H1140"/>
    <path d="M1240 218V288H1100"/><path d="M960 330H860"/><path d="M760 330H650"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g><rect x="60" y="125" width="160" height="100" rx="18" fill="#F9D5E5" stroke="#7B2E52" stroke-width="3"/><text x="140" y="165" text-anchor="middle" fill="#22151B" font-size="17" font-weight="700">Original</text><text x="140" y="190" text-anchor="middle" fill="#22151B" font-size="17" font-weight="700">recording</text></g>
    <g><rect x="300" y="125" width="200" height="100" rx="18" fill="#D8EEFF" stroke="#2E617B" stroke-width="3"/><text x="400" y="165" text-anchor="middle" fill="#12222A" font-size="16" font-weight="700">Inspect source</text><text x="400" y="190" text-anchor="middle" fill="#12222A" font-size="16" font-weight="700">+ machine</text></g>
    <g><rect x="580" y="125" width="200" height="100" rx="18" fill="#E8D9FF" stroke="#68469B" stroke-width="3"/><text x="680" y="165" text-anchor="middle" fill="#1F1630" font-size="16" font-weight="700">Transcribe</text><text x="680" y="190" text-anchor="middle" fill="#1F1630" font-size="16" font-weight="700">+ checkpoint</text></g>
    <g><rect x="860" y="125" width="200" height="100" rx="18" fill="#FFF0B8" stroke="#8A6B18" stroke-width="3"/><text x="960" y="165" text-anchor="middle" fill="#2C260F" font-size="16" font-weight="700">Canonical</text><text x="960" y="190" text-anchor="middle" fill="#2C260F" font-size="16" font-weight="700">transcript JSON</text></g>
    <g><rect x="1140" y="125" width="220" height="100" rx="18" fill="#DDF5E3" stroke="#347A46" stroke-width="3"/><text x="1250" y="165" text-anchor="middle" fill="#142719" font-size="16" font-weight="700">Lexical / semantic</text><text x="1250" y="190" text-anchor="middle" fill="#142719" font-size="16" font-weight="700">search views</text></g>
    <g><rect x="960" y="285" width="220" height="90" rx="18" fill="#FFF0B8" stroke="#8A6B18" stroke-width="3"/><text x="1070" y="323" text-anchor="middle" fill="#2C260F" font-size="16" font-weight="700">Verify canonical</text><text x="1070" y="347" text-anchor="middle" fill="#2C260F" font-size="16" font-weight="700">evidence</text></g>
    <g><rect x="650" y="285" width="210" height="90" rx="18" fill="#D8EEFF" stroke="#2E617B" stroke-width="3"/><text x="755" y="323" text-anchor="middle" fill="#12222A" font-size="16" font-weight="700">Context, words</text><text x="755" y="347" text-anchor="middle" fill="#12222A" font-size="16" font-weight="700">+ seek cursor</text></g>
    <g><rect x="350" y="285" width="230" height="90" rx="18" fill="#F9D5E5" stroke="#7B2E52" stroke-width="3"/><text x="465" y="323" text-anchor="middle" fill="#22151B" font-size="16" font-weight="700">Notes, tags,</text><text x="465" y="347" text-anchor="middle" fill="#22151B" font-size="16" font-weight="700">collections, questions</text></g>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">
    <rect x="1240" y="292" width="270" height="70" rx="16" fill="#FFD6D6" stroke="#9E3434" stroke-width="3"/>
    <text x="1375" y="321" text-anchor="middle" fill="#351616">Destructive work stays explicit:</text><text x="1375" y="344" text-anchor="middle" fill="#351616">typed custody planning</text>
  </g>
</svg>
