[project]
name = "echoflow"
version = "0.1.0"
description = "A local-first audio processing, transcription, and analysis application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SSD" }]
dependencies = [
    "dependency-injector>=4.48,<5",
    "pendulum>=3,<4",
    "psutil>=7,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6,<7",
    "structlog>=25,<26",
    "typer>=0.16,<1",
    "rich>=14,<15",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3,<4",
    "hypothesis>=6.135,<7",
    "poodle>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.14,<4",
    "ruff>=0.12,<1",
]

[project.scripts]
echoflow = "src.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.poodle]
source_folders = ["."]
only_files = [
    "src/cli.py",
    "src/core/config.py",
    "src/core/file_manager_facade.py",
    "src/core/health_check.py",
    "src/core/health_probes.py",
    "src/core/performance_tracker.py",
    "src/interfaces/local_file_manager.py",
]
file_filters = [
    ".git/**",
    ".hypothesis/**",
    ".poodle-temp/**",
    ".venv/**",
    "tests/**",
]
file_copy_filters = [
    ".git/**",
    ".hypothesis/**",
    ".poodle-temp/**",
    ".venv/**",
    "**/__pycache__/**",
]
max_workers = 1
min_timeout = 10
timeout_multiplier = 3
reporters = ["summary", "not_found"]

[tool.poodle.runner_opts]
command_line = "pytest -x --assert=plain -o pythonpath="

[tool.poodle.runner_opts.command_line_env]
RUN_MODE = "MUTATION"
