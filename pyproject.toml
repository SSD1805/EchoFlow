[project]
name = "scholion"
version = "0.1.0"
description = "A local-first audio processing, transcription, and analysis application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "SSD" }]
dependencies = [
    "dependency-injector>=4.48,<5",
    "duckdb>=1.4,<2",
    "psutil>=7,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "platformdirs>=4.10.1,<5",
    "structlog>=25,<26",
    "typer>=0.16,<1",
    "rich>=14,<15",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.2.1,<2",
    "lingua-language-detector>=2,<3",
]
diarization = [
    "pyannote-audio>=4,<5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.135,<7",
    "mypy>=1.17,<2",
    "poodle>=1.2,<2",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.14,<4",
    "radon>=6,<7",
    "ruff>=0.12,<1",
    "types-psutil>=7,<8",
    "vulture>=2.16,<3",
]

[project.scripts]
scholion = "scholion.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholion"]

[tool.hatch.build]
exclude = [
    "**/tests/**",
    "**/test_*.py",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["src/scholion"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["scholion"]
omit = ["src/scholion/**/tests/*"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "S", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603"]
# Custody tests use synthetic non-secret confirmation values and synthetic /tmp lifecycle
# paths to exercise path/plan behavior. Scope the false-positive exceptions to these two
# test modules rather than weakening the production or repository-wide security rules.
"src/scholion/library/tests/test_custody.py" = ["S106", "S108"]
"src/scholion/tests/test_cli_custody.py" = ["S106"]
# The navigation adapter interpolates only closed internal table/order fragments selected
# by code; every runtime/user value remains a bound SQLite parameter.
"src/scholion/library/workspace_metadata.py" = ["S608"]

[tool.radon]
# Report B-or-worse complexity; Ruff enforces the hard score-above-10 gate.
cc_min = "B"
mi_min = "B"
show_complexity = true
show_mi = true
average = true
exclude = "**/tests/*"

[tool.vulture]
paths = ["src/scholion"]
exclude = ["**/tests/**"]
ignore_names = ["cls"]
min_confidence = 100
sort_by_size = true

[tool.poodle]
source_folders = ["."]
only_files = [
    "src/scholion/cli.py",
    "src/scholion/core/config.py",
    "src/scholion/core/file_manager_facade.py",
    "src/scholion/core/health_check.py",
    "src/scholion/core/health_probes.py",
    "src/scholion/core/logger.py",
    "src/scholion/core/performance_tracker.py",
    "src/scholion/core/privacy.py",
    "src/scholion/interfaces/local_file_manager.py",
    "src/scholion/interfaces/private_storage.py",
    "src/scholion/library/index.py",
    "src/scholion/library/duckdb_index.py",
    "src/scholion/library/duckdb_semantic.py",
    "src/scholion/library/projection.py",
    "src/scholion/library/retrieval.py",
    "src/scholion/library/semantic.py",
    "src/scholion/library/service.py",
    "src/scholion/library/speaker_label_service.py",
    "src/scholion/library/transcript_tools.py",
    "src/scholion/library/playback.py",
    "src/scholion/media/models.py",
    "src/scholion/media/probe.py",
    "src/scholion/model_management/catalog.py",
    "src/scholion/model_management/models.py",
    "src/scholion/model_management/provider.py",
    "src/scholion/model_management/service.py",
    "src/scholion/runner/inspector.py",
    "src/scholion/runner/models.py",
    "src/scholion/runner/policy.py",
    "src/scholion/runner/topology.py",
    "src/scholion/transcription/models.py",
    "src/scholion/transcription/adaptive_executor.py",
    "src/scholion/transcription/assembly.py",
    "src/scholion/transcription/audio.py",
    "src/scholion/transcription/backend.py",
    "src/scholion/transcription/capabilities.py",
    "src/scholion/transcription/checkpoint.py",
    "src/scholion/transcription/diarization.py",
    "src/scholion/transcription/enhancement.py",
    "src/scholion/transcription/enhancement_models.py",
    "src/scholion/transcription/executor.py",
    "src/scholion/transcription/export.py",
    "src/scholion/transcription/language.py",
    "src/scholion/transcription/pipeline.py",
    "src/scholion/transcription/planner.py",
    "src/scholion/transcription/segmentation.py",
    "src/scholion/transcription/speaker_models.py",
    "src/scholion/transcription/strategy.py",
    "src/scholion/desktop/transcript_tools_bridge.py",
    "src/scholion/desktop/playback_bridge.py",
    "src/scholion/workspace/models.py",
    "src/scholion/workspace/service.py",
]
file_filters = [
    ".git/**",
    ".hypothesis/**",
    ".poodle-temp/**",
    ".venv/**",
    "**/tests/**",
]
file_copy_filters = [
    ".git/**",
    ".hypothesis/**",
    ".poodle-temp/**",
    ".venv/**",
    "**/__pycache__/**",
]
max_workers = 1
min_timeout = 10
timeout_multiplier = 3
reporters = ["summary", "not_found"]

[tool.poodle.runner_opts]
command_line = "pytest -x --assert=plain -o pythonpath="

[tool.poodle.runner_opts.command_line_env]
RUN_MODE = "MUTATION"

[tool.mypy]
python_version = "3.12"
files = ["src/scholion"]
exclude = ["src/scholion/.*/tests/", "src/scholion/tests/"]
strict = true
warn_unreachable = true
pretty = true
